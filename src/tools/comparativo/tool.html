<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZELT · Comparativo de Construtoras</title>
<style>
@@FILE:tools/comparativo/style.css@@
</style>
@@FILE:tools/comparativo/layout.html@@
<script>
@@FILE:tools/comparativo/data/empreendimentos.js@@
@@FILE:tools/comparativo/app.js@@
</script>

<div id="view-investimentos" class="tabview" hidden>
<div class="wrap">

  <div class="filters">
    <div class="filters-head">
      <span class="eyebrow">Investimentos</span>
      <p class="filters-sub">Evolução dos valores conforme as tabelas que temos arquivadas de cada
      construtora. Mostra apenas unidades ainda disponíveis. Clique no empreendimento para escolher a
      unidade e gerar o gráfico.</p>
    </div>
    <div class="sales-filters">
      <input type="search" id="inv-search" class="sales-search" placeholder="Buscar empreendimento…">
      <select id="inv-constr" class="sales-constr" aria-label="Filtrar por construtora"></select>
    </div>
    <div class="sales-filters">
      <select id="inv-periodo" class="sales-constr" aria-label="Período">
        <option value="3">Últimos 3 meses</option>
        <option value="6">Últimos 6 meses</option>
        <option value="12">Últimos 12 meses</option>
        <option value="all" selected>Todo o histórico</option>
      </select>
      <select id="inv-ordem" class="sales-constr" aria-label="Ordenar">
        <option value="desc" selected>Maior valorização média</option>
        <option value="asc">Menor valorização média</option>
      </select>
    </div>
  </div>

  <div class="results-head">
    <div class="count-big"><span id="inv-count">0</span></div>
    <div class="count-lbl">empreendimentos<br>com histórico</div>
  </div>

  <div id="inv-list" class="inv-list"></div>
</div>
</div>

<div id="inv-modal" class="inv-modal" hidden>
  <div class="inv-modal-card">
    <button class="inv-close" id="inv-close" aria-label="Fechar">&times;</button>
    <div id="inv-modal-body"></div>
  </div>
</div>

<!-- ZELT: voltar ao hub -->
<style>
.zelt-back-hub{
  position:fixed;left:16px;bottom:16px;z-index:99999;
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Oswald','Arial Narrow',sans-serif;
  font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  text-decoration:none;color:#fff;background:#1e1b35;
  border:1px solid #383360;border-radius:999px;padding:10px 18px;
  box-shadow:0 4px 12px rgba(30,27,53,.25);
  transition:background .15s ease;
}
.zelt-back-hub:hover{background:#2a2647}
.zelt-back-hub svg{width:14px;height:14px;stroke:#ff9e36}
@media print{.zelt-back-hub{display:none!important}}
</style>
<a class="zelt-back-hub" href="#" title="Voltar ao Hub ZELT" onclick="event.preventDefault();if(window.parent!==window){window.parent.postMessage('zelt-close-tool','*');}else{history.back();}">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
Hub ZELT
</a>
</body>
</html>

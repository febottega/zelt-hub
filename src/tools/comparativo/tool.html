<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZELT · Comparativo de Construtoras</title>
<style>
@@FILE:tools/comparativo/style.css@@
</style>
@@FILE:tools/comparativo/layout.html@@
<script>
@@FILE:tools/comparativo/data/empreendimentos.js@@
@@FILE:tools/comparativo/app.js@@
</script>

<div id="view-investimentos" class="tabview" hidden>
<div class="wrap">

  <div class="filters">
    <div class="filters-head">
      <span class="eyebrow">Investimentos</span>
      <p class="filters-sub">Evolução dos valores conforme as tabelas que temos arquivadas de cada
      construtora. Mostra apenas unidades ainda disponíveis. Clique no empreendimento para escolher a
      unidade e gerar o gráfico.</p>
    </div>
    <div class="sales-filters">
      <input type="search" id="inv-search" class="sales-search" placeholder="Buscar empreendimento…">
      <select id="inv-constr" class="sales-constr" aria-label="Filtrar por construtora"></select>
    </div>
    <div class="sales-filters">
      <select id="inv-periodo" class="sales-constr" aria-label="Período">
        <option value="3">Últimos 3 meses</option>
        <option value="6">Últimos 6 meses</option>
        <option value="12">Últimos 12 meses</option>
        <option value="all" selected>Todo o histórico</option>
      </select>
      <select id="inv-ordem" class="sales-constr" aria-label="Ordenar">
        <option value="desc" selected>Maior valorização média</option>
        <option value="asc">Menor valorização média</option>
      </select>
    </div>
  </div>

  <div class="results-head">
    <div class="count-big"><span id="inv-count">0</span></div>
    <div class="count-lbl">empreendimentos<br>com histórico</div>
  </div>

  <div id="inv-list" class="inv-list"></div>
</div>
</div>

<div id="inv-modal" class="inv-modal" hidden>
  <div class="inv-modal-card">
    <button class="inv-close" id="inv-close" aria-label="Fechar">&times;</button>
    <div id="inv-modal-body"></div>
  </div>
</div>

<!-- ZELT: voltar ao hub pelo logo -->
<style>
/* O logo da ZELT no topo e o caminho de volta ao hub. Saiu daqui o botao
   fixo no canto inferior esquerdo: ficava por cima do conteudo em toda
   tela e em toda ferramenta. */
.topbar .brand img.zelt-logo{cursor:pointer;transition:opacity .15s ease}
.topbar .brand img.zelt-logo:hover{opacity:.68}
.topbar .brand img.zelt-logo:focus-visible{outline:2px solid #ff9e36;outline-offset:4px;border-radius:3px}
</style>
<script>
(function(){
  /* Unica linha que muda de ferramenta para ferramenta. */
  var SELETOR = '.topbar .brand img.zelt-logo';

  function volta(ev){
    if(ev){ ev.preventDefault(); ev.stopPropagation(); }
    if(window.parent !== window){ window.parent.postMessage('zelt-close-tool','*'); }
    else { history.back(); }
  }

  /* Delegacao: vale para logo desenhado depois do load. */
  document.addEventListener('click', function(ev){
    var t = ev.target;
    if(t && t.closest && t.closest(SELETOR)) volta(ev);
  });
  document.addEventListener('keydown', function(ev){
    if(ev.key !== 'Enter' && ev.key !== ' ') return;
    var a = document.activeElement;
    if(a && a.closest && a.closest(SELETOR)) volta(ev);
  });

  /* Dica de uso e teclado, quando o elemento existir. Reagenda porque em
     algumas ferramentas o cabecalho ainda nao esta na tela no boot. */
  var n = 0;
  (function rotula(){
    var el = document.querySelector(SELETOR);
    if(el){
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('title','Voltar ao Hub ZELT');
      el.setAttribute('aria-label','Voltar ao Hub ZELT');
      return;
    }
    if(++n < 12) setTimeout(rotula, 250);
  })();
})();
</script>
</body>
</html>
